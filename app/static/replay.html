<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Replay · VS Gammon</title>
  <link rel="preload" href="/static/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <script>try{document.documentElement.lang=localStorage.getItem("ga-lang")==="ru"?"ru":"en"}catch(e){}</script>
  <style>
    @font-face { font-family: Inter; src: url("/static/fonts/inter-latin.woff2") format("woff2"); font-weight: 100 900; }
    :root { color-scheme: dark; --page: #030712; --text: #e5e7eb; --muted: #8a93a6; --line: #1f2937; --accent: #3b82f6; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--page); color: var(--text); font: 14px/1.45 Inter, system-ui, sans-serif; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    header h1 { font-size: 14px; font-weight: 650; margin: 0; }
    header .info { color: var(--muted); }
    header .spacer { flex: 1; }
    button, select { font: inherit; color: var(--text); background: #111827; border: 1px solid #374151; border-radius: 7px; min-height: 30px; padding: 0 12px; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    main { flex: 1; min-height: 0; display: grid; place-items: center; padding: 16px; }
    #board { width: 100%; height: 100%; max-width: 1100px; }
    .picker { width: min(560px, 100%); }
    .picker p { color: var(--muted); }
    .picker a { display: block; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; color: var(--text); text-decoration: none; }
    .picker a:hover { border-color: var(--accent); }
    .picker a span { color: var(--muted); }
  </style>
</head>
<body>
<header>
  <h1>Replay</h1>
  <span class="info" id="info"></span>
  <span class="spacer"></span>
  <label class="info" for="speed">Speed</label>
  <select id="speed"><option value="2000">Slow</option><option value="1200" selected>Normal</option><option value="700">Fast</option></select>
  <button type="button" id="restart">Restart</button>
  <button type="button" class="primary" id="toggle">Pause</button>
</header>
<main id="stage"></main>
<script src="/static/js/i18n-ru.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/replay.js"></script>
</body>
</html>
